name: laro-be-centered-v13-27

# One PostgreSQL/Redis/Neo4j stack is shared by the existing Spring BE and LARO.
# The Spring application owns the business/runtime writes. LARO reads those
# tables/keys, runs Rule/Agent + Solver + MAPF, and stores only planning results.
services:
  postgres:
    image: postgres:16-alpine
    container_name: laro-be-centered-v13-27-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - laro_be_centered_v13_27_postgres_data:/var/lib/postgresql/data
      # Existing /optimize compatibility only. No business-order/HU tables.
      - ./db/postgres/003_be_shared_contract.sql:/docker-entrypoint-initdb.d/003_be_shared_contract.sql:ro
      # Additive planning profiles/results over the Spring BE schema.
      - ./db/postgres/004_be_centered_extensions.sql:/docker-entrypoint-initdb.d/004_be_centered_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-warehouse}"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    container_name: laro-be-centered-v13-27-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-laro-redis}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - laro_be_centered_v13_27_redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-laro-redis}
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD:-laro-redis}" ping 2>/dev/null | grep PONG
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  neo4j:
    image: neo4j:5.26-community
    container_name: laro-be-centered-v13-27-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-laro-password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - laro_be_centered_v13_27_neo4j_data:/data
      - laro_be_centered_v13_27_neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          AUTH="$${NEO4J_AUTH:-neo4j/laro-password}";
          USER="$${AUTH%%/*}";
          PASS="$${AUTH#*/}";
          cypher-shell -a bolt://localhost:7687 -u "$${USER}" -p "$${PASS}" "RETURN 1;" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  laro-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laro-be-centered-v13-27-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      APP_ENV: docker
      WAREHOUSE_REPOSITORY_BACKEND: be_shared
      MAP_REPOSITORY_BACKEND: neo4j
      INFRASTRUCTURE_STRICT_STARTUP: "true"
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-warehouse}
      REDIS_URL: redis://:${REDIS_PASSWORD:-laro-redis}@redis:6379/0
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-laro-password}

      # Existing Spring /optimize and /reoptimize compatibility remains intact.
      BE_COMPAT_ENABLED: ${BE_COMPAT_ENABLED:-true}
      BE_COMPAT_GRAPH_SOURCE: ${BE_COMPAT_GRAPH_SOURCE:-auto}
      BE_COMPAT_GRAPH_CACHE_MODE: ${BE_COMPAT_GRAPH_CACHE_MODE:-metadata}
      BE_COMPAT_RUNTIME_SOURCE: ${BE_COMPAT_RUNTIME_SOURCE:-request_then_redis}
      BE_COMPAT_CONTRACT_SCHEMA_ENABLED: ${BE_COMPAT_CONTRACT_SCHEMA_ENABLED:-true}
      BE_COMPAT_DEBUG_RUNTIME_API_ENABLED: ${BE_COMPAT_DEBUG_RUNTIME_API_ENABLED:-true}
      BE_COMPAT_DEFAULT_EDGE_STATUS: ${BE_COMPAT_DEFAULT_EDGE_STATUS:-OPEN}
      BE_COMPAT_ROBOT_SPEED_DISTANCE_PER_SECOND: ${BE_COMPAT_ROBOT_SPEED_DISTANCE_PER_SECOND:-1.0}
      BE_COMPAT_MIN_BATTERY_PCT: ${BE_COMPAT_MIN_BATTERY_PCT:-30}
      BE_COMPAT_GRAPH_CACHE_TTL_SECONDS: ${BE_COMPAT_GRAPH_CACHE_TTL_SECONDS:-86400}
      BE_COMPAT_NEO4J_PROJECTION: ${BE_COMPAT_NEO4J_PROJECTION:-true}

      DEFAULT_WAREHOUSE_ID: ${DEFAULT_WAREHOUSE_ID:-WH-001}
      RUNTIME_SIMULATION_ID: ${RUNTIME_SIMULATION_ID:-BE-RUN-1}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-laro}
      OUTBOUND_FULFILLMENT_MODE: ${OUTBOUND_FULFILLMENT_MODE:-goods_to_person}
      # Operating path reads Spring Redis. Enable only for reproducible tests.
      ALLOW_API_RUNTIME_SNAPSHOT: ${ALLOW_API_RUNTIME_SNAPSHOT:-false}

      DEFAULT_PLANNING_MODE: ${DEFAULT_PLANNING_MODE:-llm_router}
      ALLOW_REQUEST_PLANNING_MODE_OVERRIDE: ${ALLOW_REQUEST_PLANNING_MODE_OVERRIDE:-false}
      WORKLOAD_RULE_MAX_OPERATION_COUNT: ${WORKLOAD_RULE_MAX_OPERATION_COUNT:-8}
      WORKLOAD_AGENT_MIN_OPERATION_COUNT: ${WORKLOAD_AGENT_MIN_OPERATION_COUNT:-16}
      WORKLOAD_RULE_MAX_OPERATIONS_PER_ROBOT: ${WORKLOAD_RULE_MAX_OPERATIONS_PER_ROBOT:-2.0}
      WORKLOAD_AGENT_MIN_OPERATIONS_PER_ROBOT: ${WORKLOAD_AGENT_MIN_OPERATIONS_PER_ROBOT:-3.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-180}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-0}
      LLM_CUOPT_FORMULATION_MAX_RETRIES: ${LLM_CUOPT_FORMULATION_MAX_RETRIES:-0}

      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPTIMIZATION_BACKEND: ${OPTIMIZATION_BACKEND:-ortools}
      CUOPT_TRANSPORT: ${CUOPT_TRANSPORT:-nvidia_api}
      CUOPT_PAYLOAD_FORMAT: ${CUOPT_PAYLOAD_FORMAT:-native}
      CUOPT_API_URL: ${CUOPT_API_URL:-https://optimize.api.nvidia.com/v1/nvidia/cuopt}
      CUOPT_SOLUTION_URL_TEMPLATE: ${CUOPT_SOLUTION_URL_TEMPLATE:-https://optimize.api.nvidia.com/v1/status/{req_id}}
      CUOPT_NVCF_POLL_SECONDS: ${CUOPT_NVCF_POLL_SECONDS:-90}
      CUOPT_REQUEST_TIMEOUT_SECONDS: ${CUOPT_REQUEST_TIMEOUT_SECONDS:-150}
      CUOPT_TRANSIENT_MAX_RETRIES: ${CUOPT_TRANSIENT_MAX_RETRIES:-2}
      CUOPT_RETRY_BACKOFF_SECONDS: ${CUOPT_RETRY_BACKOFF_SECONDS:-5}

      FRONTEND_EXPLANATION_MODE: ${FRONTEND_EXPLANATION_MODE:-deterministic}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-laro-be-centered-v13-27}
      NODE_CONSOLE_TRACE: ${NODE_CONSOLE_TRACE:-true}
      PLANNING_EVALUATION_MODE: ${PLANNING_EVALUATION_MODE:-off}
      PLANNING_EVALUATION_COMPARE_BACKEND: ${PLANNING_EVALUATION_COMPARE_BACKEND:-cuopt}
    ports:
      - "${LARO_API_HOST_PORT:-8000}:8000"
    volumes:
      - laro_be_centered_v13_27_runtime_outputs:/app/runtime_outputs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  laro_be_centered_v13_27_postgres_data:
  laro_be_centered_v13_27_redis_data:
  laro_be_centered_v13_27_neo4j_data:
  laro_be_centered_v13_27_neo4j_logs:
  laro_be_centered_v13_27_runtime_outputs:
