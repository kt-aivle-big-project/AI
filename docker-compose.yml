name: laro-be-plan-bridge-v4

# This stack owns the DB servers used by both the unmodified Spring BE and LARO.
# Run BE-main locally with its existing "local" profile; it will connect to the
# standard host ports below without a source-code change.
services:
  postgres:
    image: postgres:16-alpine
    container_name: laro-be-plan-bridge-v4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - laro_be_plan_v4_postgres_data:/var/lib/postgresql/data
      - ./db/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_laro_native_schema.sql:ro
      - ./db/postgres/003_be_shared_contract.sql:/docker-entrypoint-initdb.d/003_be_shared_contract.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-warehouse}"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    container_name: laro-be-plan-bridge-v4-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-laro-redis}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - laro_be_plan_v4_redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD:-laro-redis}" ping 2>/dev/null | grep PONG
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-laro-redis}

  neo4j:
    image: neo4j:5.26-community
    container_name: laro-be-plan-bridge-v4-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-laro-password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - laro_be_plan_v4_neo4j_data:/data
      - laro_be_plan_v4_neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          AUTH="$${NEO4J_AUTH:-neo4j/laro-password}";
          USER="$${AUTH%%/*}";
          PASS="$${AUTH#*/}";
          cypher-shell -a bolt://localhost:7687 -u "$${USER}" -p "$${PASS}" "RETURN 1;" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  laro-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laro-be-plan-bridge-v4-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      APP_ENV: docker
      WAREHOUSE_REPOSITORY_BACKEND: live
      MAP_REPOSITORY_BACKEND: neo4j
      INFRASTRUCTURE_STRICT_STARTUP: "true"
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-warehouse}
      REDIS_URL: redis://:${REDIS_PASSWORD:-laro-redis}@redis:6379/0
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-laro-password}

      BE_COMPAT_ENABLED: ${BE_COMPAT_ENABLED:-true}
      BE_COMPAT_GRAPH_SOURCE: ${BE_COMPAT_GRAPH_SOURCE:-auto}
      BE_COMPAT_GRAPH_CACHE_MODE: ${BE_COMPAT_GRAPH_CACHE_MODE:-metadata}
      BE_COMPAT_RUNTIME_SOURCE: ${BE_COMPAT_RUNTIME_SOURCE:-request_then_redis}
      BE_COMPAT_CONTRACT_SCHEMA_ENABLED: ${BE_COMPAT_CONTRACT_SCHEMA_ENABLED:-true}
      BE_COMPAT_DEBUG_RUNTIME_API_ENABLED: ${BE_COMPAT_DEBUG_RUNTIME_API_ENABLED:-true}
      BE_COMPAT_DEFAULT_EDGE_STATUS: ${BE_COMPAT_DEFAULT_EDGE_STATUS:-OPEN}
      BE_COMPAT_ROBOT_SPEED_DISTANCE_PER_SECOND: ${BE_COMPAT_ROBOT_SPEED_DISTANCE_PER_SECOND:-1.0}
      BE_COMPAT_MIN_BATTERY_PCT: ${BE_COMPAT_MIN_BATTERY_PCT:-30}
      BE_COMPAT_GRAPH_CACHE_TTL_SECONDS: ${BE_COMPAT_GRAPH_CACHE_TTL_SECONDS:-86400}
      BE_COMPAT_NEO4J_PROJECTION: ${BE_COMPAT_NEO4J_PROJECTION:-true}

      DEFAULT_WAREHOUSE_ID: ${DEFAULT_WAREHOUSE_ID:-WH-001}
      RUNTIME_SIMULATION_ID: ${RUNTIME_SIMULATION_ID:-SIM-V18-MIXED}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-laro}
      OUTBOUND_FULFILLMENT_MODE: ${OUTBOUND_FULFILLMENT_MODE:-goods_to_person}
      ALLOW_API_RUNTIME_SNAPSHOT: ${ALLOW_API_RUNTIME_SNAPSHOT:-true}

      DEFAULT_PLANNING_MODE: ${DEFAULT_PLANNING_MODE:-force_rule}
      ALLOW_REQUEST_PLANNING_MODE_OVERRIDE: ${ALLOW_REQUEST_PLANNING_MODE_OVERRIDE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}

      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPTIMIZATION_BACKEND: ${OPTIMIZATION_BACKEND:-ortools}
      CUOPT_TRANSPORT: ${CUOPT_TRANSPORT:-nvidia_api}
      CUOPT_PAYLOAD_FORMAT: ${CUOPT_PAYLOAD_FORMAT:-native}
      CUOPT_API_URL: ${CUOPT_API_URL:-https://optimize.api.nvidia.com/v1/nvidia/cuopt}
      CUOPT_SOLUTION_URL_TEMPLATE: ${CUOPT_SOLUTION_URL_TEMPLATE:-https://optimize.api.nvidia.com/v1/status/{req_id}}

      FRONTEND_EXPLANATION_MODE: ${FRONTEND_EXPLANATION_MODE:-deterministic}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-laro-native-plan-bridge}
      NODE_CONSOLE_TRACE: ${NODE_CONSOLE_TRACE:-true}
      PLANNING_EVALUATION_MODE: ${PLANNING_EVALUATION_MODE:-off}
    ports:
      - "${LARO_API_HOST_PORT:-8000}:8000"
    volumes:
      - laro_be_plan_v4_runtime_outputs:/app/runtime_outputs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  laro_be_plan_v4_postgres_data:
  laro_be_plan_v4_redis_data:
  laro_be_plan_v4_neo4j_data:
  laro_be_plan_v4_neo4j_logs:
  laro_be_plan_v4_runtime_outputs:
